{% extends "layouts/base.html" %}
{% block title %}시험 실행 목록{% endblock %}

{% block head %}
<link href="{{ url_for('static', filename='execution/css/style.css') }}?v={{ cache_bust }}" rel="stylesheet">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; margin: 0; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex flex-column h-100 overflow-hidden">
<!-- 페이지 헤더 -->
<div class="exec-page-header">
  <div class="exec-page-title">
    <div class="title-icon"><i class="bi bi-list-check"></i></div>
    시험 실행 목록
    <span class="exec-item-count" id="item-count"></span>
    <span class="exec-status-summary" id="status-summary"></span>
  </div>
  <div class="exec-page-actions">
    <button class="btn btn-sm btn-outline-secondary" onclick="loadList()" title="새로고침">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <div class="dropdown">
    <button class="btn btn-sm btn-outline-secondary" type="button"
            id="col-settings-btn" data-bs-toggle="dropdown" data-bs-auto-close="outside"
            title="열 표시 설정">
      <i class="bi bi-layout-three-columns"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" id="col-toggle-menu" style="min-width:140px"></ul>
    </div>
  </div>
</div>

<!-- 테이블 -->
<div class="exec-table-wrapper">
  <table class="exec-table">
    <thead>
      <tr></tr>
    </thead>
    <tbody id="exec-tbody">
      <tr><td colspan="10" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2"></div>로딩 중…</td></tr>
    </tbody>
  </table>
</div>
</div>
{% endblock %}

{% block script %}
<script>var BARCODE_PREFIX = {{ barcode_prefix | tojson }};</script>
<script src="{{ url_for('static', filename='execution/js/execution-app.js') }}?v={{ cache_bust }}"></script>
{% endblock %}
